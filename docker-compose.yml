# The full stack: cp .env.example .env && docker compose up
# For backend development on the host, start only the services:
#   docker compose up -d postgres redis

# Shared by api and worker. Inside the network the services are reached by name,
# not localhost, so the URLs are set here rather than taken from .env.
x-backend: &backend
  build: ./backend
  environment:
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cramplan}:${POSTGRES_PASSWORD:-cramplan}@postgres:5432/${POSTGRES_DB:-cramplan}
    REDIS_URL: redis://redis:6379/0
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    # For `docker compose exec api python -m app.seed`; defaults match app/core/config.py.
    DEMO_EMAIL: ${DEMO_EMAIL:-demo@example.com}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-local-demo-only-2026!}
  restart: unless-stopped

services:
  api:
    <<: *backend
    # Migrate before serving, so a fresh database is ready without manual steps.
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000 --no-access-log"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cramplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cramplan}
      POSTGRES_DB: ${POSTGRES_DB:-cramplan}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the data volume is first created: adds the cramplan_test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
