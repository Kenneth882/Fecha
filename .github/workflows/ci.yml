name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cramplan
          POSTGRES_PASSWORD: cramplan
          POSTGRES_DB: cramplan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cramplan -d cramplan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only throwaway values; nothing here is a real secret.
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-bytes
      DATABASE_URL: postgresql+asyncpg://cramplan:cramplan@localhost:5432/cramplan
      TEST_DATABASE_URL: postgresql+asyncpg://cramplan:cramplan@localhost:5432/cramplan_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests alembic

      - name: Migrate an empty database
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Create the test database
        run: createdb -h localhost -U cramplan cramplan_test
        env:
          PGPASSWORD: cramplan

      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The client freshness check exports the OpenAPI schema from the backend.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Check the generated API client is up to date
        run: |
          npm run generate:api
          git add --intent-to-add -- src/lib/api   # so new generated files show in the diff too
          git diff --exit-code -- src/lib/api || {
            echo "::error::The API client is stale. Run 'npm run generate:api' in web/ and commit the result."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The image `docker compose up` runs as the web service.
      - name: Build the Docker image
        run: docker build --tag cramplan-web .

  # The one Playwright test, onboarding → first Task, against the compose stack that
  # a reviewer runs: built from this commit, on a fresh database.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: |
          cp .env.example .env   # the local placeholders; nothing here is a real secret
          docker compose up --detach --build

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      # The api container migrates and loads the seed vocabulary before it serves.
      - name: Wait for the stack
        run: |
          for _ in $(seq 1 90); do
            if curl --silent --fail http://localhost:8000/api/v1/health/ready > /dev/null &&
               curl --silent --fail --output /dev/null http://localhost:3000/login; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The stack wasn't ready after 3 minutes."
          exit 1

      - name: Run the E2E test
        run: npm run test:e2e
        working-directory: web

      - name: Show the stack's logs
        if: failure()
        run: docker compose logs --no-color

      # The HTML report, with a trace for every failed attempt: also when a retry
      # passed, so a flaky run leaves something to look at.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14
