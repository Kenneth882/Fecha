repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: bash -c 'cd backend && uv run mypy app tests'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
